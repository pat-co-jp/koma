<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koma">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Koma</title>
<script src="vendor/jszip.min.js"></script>
<style>
:root{
  --ink:#0e0e10;--panel:#18181b;--line:#2b2b31;--text:#ecebe6;--mute:#9a988f;
  --accent:#e0533a;--gold:#f2c14e;--paper:#f7f2e8;--paper2:#ece5d6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Sans",serif}
[hidden]{display:none!important}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- library ---------- */
#lib{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10}
.lib-head{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 10px calc(var(--sl) + 18px)}
.lib-head h1{flex:1;margin:0;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.lib-head h1 b{font:700 26px/1 "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--accent)}
.lib-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px calc(var(--sr) + 16px) calc(var(--sb) + 30px) calc(var(--sl) + 16px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px}
.vol{position:relative;text-align:left;display:block;width:100%}
.vol .cv{aspect-ratio:1/1.42;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.vol .cv img{width:100%;height:100%;object-fit:cover;display:block}
.vol .t{font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vol .m{font-size:12px;color:var(--mute);margin-top:2px}
.vol .bar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.vol .bar i{display:block;height:100%;background:var(--accent)}
.badge{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(14,14,16,.82);color:var(--gold)}
.badge.none{color:var(--mute)}
.empty{max-width:520px;margin:30px auto 0;color:var(--mute);font-size:14px}
.empty .big{display:flex;width:100%;justify-content:center;padding:15px;font-size:16px;font-weight:600;border-radius:14px;background:var(--accent);color:#fff;margin:18px 0}
.empty ol{padding-left:18px}
.empty li{margin:6px 0}
.foot{color:var(--mute);font-size:12px;margin-top:26px;text-align:center}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:20;background:var(--ink)}
#viewer{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.anim{transition:transform .22s ease}
#pg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;background:#fff}
#overlay{position:absolute;inset:0}
.bx{position:absolute;border:1.5px solid rgba(224,83,58,.8);background:rgba(224,83,58,.07);border-radius:7px;min-width:24px;min-height:24px}
.bx i{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;font:700 10px/17px system-ui;font-style:normal;min-width:17px;height:17px;border-radius:9px;text-align:center;padding:0 4px;pointer-events:none}
.bx.on{border-color:var(--gold);background:rgba(242,193,78,.16);box-shadow:0 0 0 3px rgba(242,193,78,.35)}
.bx.sfx{border-style:dashed}
.bar{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;gap:6px;transition:transform .2s ease,opacity .2s ease}
#top{top:0;padding:calc(var(--st) + 6px) calc(var(--sr) + 10px) 10px calc(var(--sl) + 10px);background:linear-gradient(to bottom,rgba(14,14,16,.92),rgba(14,14,16,.72) 70%,rgba(14,14,16,0))}
#bottom{bottom:0;padding:14px calc(var(--sr) + 84px) calc(var(--sb) + 12px) calc(var(--sl) + 16px);background:linear-gradient(to top,rgba(14,14,16,.92),rgba(14,14,16,.6) 70%,rgba(14,14,16,0))}
#reader.hide-chrome #top{transform:translateY(-110%);opacity:0;pointer-events:none}
#reader.hide-chrome #bottom{transform:translateY(110%);opacity:0;pointer-events:none}
.ttl{flex:1;min-width:0;text-align:center}
.ttl b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--mute)}
#slider{flex:1;accent-color:var(--accent);height:28px}
#pnum{font-size:12px;color:var(--mute);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#boxBtn{position:absolute;z-index:6;right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 14px);width:58px;height:58px;border-radius:50%;
  background:#2b2b31;color:var(--gold);border:1.5px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.45);display:grid;place-items:center;
  font:700 24px/1 "Hiragino Mincho ProN","Yu Mincho",serif}
#boxBtn.off{color:var(--mute);border-color:var(--line)}
#boxBtn small{position:absolute;bottom:-2px;right:-2px;background:var(--gold);color:#111;font:700 10px/17px system-ui;min-width:18px;height:18px;border-radius:9px;padding:0 4px}
#reader.sheet-open #boxBtn{opacity:0;pointer-events:none}

/* ---------- sheet ---------- */
#sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;max-height:58vh;background:var(--paper);color:#1b1a18;border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
.grab{width:38px;height:5px;border-radius:3px;background:#cfc6b3;margin:8px auto 2px}
.sh-head{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.sh-head .ib{width:36px;height:36px;color:#3a3732}
.sh-head .ib:active{background:rgba(0,0,0,.06)}
.sh-title{flex:1;font-size:12.5px;color:#7a7364;text-transform:uppercase;letter-spacing:.06em}
.line{font-size:25px;line-height:2.05;padding:2px 0 8px;word-break:break-all}
.tk{border-radius:6px;padding:0 1px;cursor:pointer;border-bottom:2px solid transparent}
.tk.on{background:#f2c14e66}
.tk.p-verb{border-bottom-color:#e0533a55}
.tk.p-noun,.tk.p-pronoun,.tk.p-name{border-bottom-color:#3d6fb455}
.tk.p-i-adj,.tk.p-na-adj,.tk.p-adverb{border-bottom-color:#4f8a5b55}
.tk.p-particle,.tk.p-aux,.tk.p-punct{color:#6d675c}
rt{font-size:.42em;color:#7a7364;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.hint{font-size:13px;color:#7a7364;padding:4px 0 10px}
.card{background:#fff;border:1px solid var(--paper2);border-radius:14px;padding:12px 14px;margin:2px 0 12px}
.card .w{font-size:26px;line-height:1.2}
.card .rd{font-size:13px;color:#7a7364;margin:2px 0 6px}
.card .g{font-size:16px;font-weight:600}
.card .n{font-size:13.5px;color:#4b463d;margin-top:6px;padding-top:6px;border-top:1px dashed #e2d9c6}
.card .row{display:flex;gap:8px;margin-top:10px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#ece5d6;color:#5a5446;margin-left:4px;vertical-align:2px;font-family:system-ui}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#ece5d6;color:#2a2724;font-size:13px;text-decoration:none}
.pill.pri{background:#1b1a18;color:#f7f2e8}
.pill.saved{background:#f2c14e;color:#1b1a18}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.tl,.note{font-size:15px;background:#fff;padding:9px 12px;border-radius:0 10px 10px 0;margin-bottom:10px}
.tl{border-left:3px solid var(--accent)}
.note{border-left:3px solid #4f8a5b;font-size:14px;line-height:1.5}

/* ---------- panels, toast, progress ---------- */
#panel{position:fixed;z-index:40;inset:0;background:var(--ink);display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 16px);border-bottom:1px solid var(--line)}
.p-head h2{flex:1;margin:0;font-size:17px}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px calc(var(--sr) + 16px) calc(var(--sb) + 24px) calc(var(--sl) + 16px)}
.grp{margin-bottom:22px}
.grp h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.grp p{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13.5px;color:var(--mute)}
.seg button.on{background:#2f2f36;color:var(--text);font-weight:600}
.vrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.vrow .vw{font-size:22px;min-width:84px}
.vrow .vr{font-size:12px;color:var(--mute)}
.vrow .vg{font-size:14.5px}
.vrow .vc{font-size:13px;color:var(--mute);margin-top:3px}
.vrow .x{color:var(--mute);margin-left:auto}
.dk{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.dk.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dk.danger{color:#ff8a7a}
textarea.copybox{width:100%;height:160px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;margin-top:10px}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--sb) + 92px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#f7f2e8;color:#1b1a18;padding:9px 14px;border-radius:12px;font-size:13.5px;max-width:86vw;text-align:center;transition:.2s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#busy{position:fixed;z-index:70;inset:0;background:rgba(14,14,16,.85);display:grid;place-items:center}
#busy div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:240px;text-align:center}
#busy .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Library -->
<section id="lib">
  <div class="lib-head">
    <h1><b>読</b>Koma</h1>
    <button class="ib" data-act="import" aria-label="Import"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg></button>
    <button class="ib" data-act="vocab" aria-label="Saved words"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="lib-body" id="libBody"></div>
</section>

<!-- Reader -->
<section id="reader" hidden>
  <div id="viewer"><div id="stage"><img id="pg" alt=""><div id="overlay"></div></div></div>
  <header id="top" class="bar">
    <button class="ib" data-act="close-reader" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="ttl"><b id="volName"></b><span id="volSub"></span></div>
    <button class="ib" data-act="vocab" aria-label="Saved words"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <footer id="bottom" class="bar">
    <input id="slider" type="range" min="1" max="1" value="1" aria-label="Page">
    <div id="pnum"></div>
  </footer>
  <button id="boxBtn" aria-label="Show or hide boxes">読</button>
  <section id="sheet"><div class="grab"></div><div id="sheetBody"></div></section>
</section>

<section id="panel" hidden></section>
<div id="busy" hidden><div><div class="spin"></div><div id="busyTxt">Working…</div></div></div>
<div id="toast"></div>
<input id="file" type="file" multiple hidden accept=".cbz,.zip,.json,application/zip,application/json,application/x-cbz,application/vnd.comicbook+zip">

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMG_RE = /\.(jpe?g|png|webp|gif|avif)$/i;
const nat = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
const mimeFor = n => /\.png$/i.test(n) ? "image/png" : /\.webp$/i.test(n) ? "image/webp" : /\.gif$/i.test(n) ? "image/gif" : /\.avif$/i.test(n) ? "image/avif" : "image/jpeg";

/* ================= storage (IndexedDB) ================= */
const DB_NAME = "koma", DB_VER = 1;
let dbp;
function db() {
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("volumes", { keyPath: "id" });
      d.createObjectStore("pages", { keyPath: ["vol", "i"] });
      d.createObjectStore("packs", { keyPath: "vol" });
      d.createObjectStore("kv", { keyPath: "k" });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(stores, mode);
    let out;
    Promise.resolve(fn(t)).then(v => { out = v; });
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error("aborted"));
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const get = (store, key) => tx([store], "readonly", t => req(t.objectStore(store).get(key)));
const put = (store, val) => tx([store], "readwrite", t => { t.objectStore(store).put(val); });
const all = store => tx([store], "readonly", t => req(t.objectStore(store).getAll()));
const kvGet = async (k, d) => { try { const r = await get("kv", k); return r ? r.v : d; } catch { return d; } };
const kvSet = (k, v) => put("kv", { k, v });

/* ================= state ================= */
const DEF = { level: 3, furi: "above", dir: "rtl", boxes: true };
let settings = { ...DEF };
const st = {
  vol: null, pack: null, idx: 0, n: 0, url: null,
  z: { z: 1, tx: 0, ty: 0 }, base: { L: 0, T: 0, w: 0, h: 0 }, shift: 0,
  sheet: null, vocab: []
};
const viewer = $("#viewer"), stage = $("#stage"), img = $("#pg"), overlay = $("#overlay");
const sheet = $("#sheet"), sheetBody = $("#sheetBody"), panel = $("#panel"), reader = $("#reader"), slider = $("#slider");
const fileIn = $("#file");
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

let toastT;
function toast(msg, action) {
  const t = $("#toast"); t.innerHTML = esc(msg); t.classList.toggle("act", !!action); t.onclick = action || null;
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), action ? 8000 : 2600);
}
function busy(msg) { const b = $("#busy"); if (!msg) { b.hidden = true; return; } $("#busyTxt").textContent = msg; b.hidden = false; }

/* ================= library ================= */
const coverUrls = new Map();
async function coverUrl(vol) {
  if (coverUrls.has(vol.id)) return coverUrls.get(vol.id);
  const p = await get("pages", [vol.id, 0]);
  const u = p ? URL.createObjectURL(p.blob) : "";
  coverUrls.set(vol.id, u); return u;
}
function fmtBytes(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB"; }
async function renderLibrary() {
  const vols = (await all("volumes")).sort((a, b) => (b.lastReadAt || b.addedAt) - (a.lastReadAt || a.addedAt));
  const body = $("#libBody");
  if (!vols.length) {
    body.innerHTML = `<div class="empty">
      <p>No volumes yet. Your laptop prepares them: drop a <b>.cbz</b> into <b>iCloud Drive › 6. Automation › Koma › Inbox</b>, and it appears in <b>Koma › Library</b> with a matching <b>.koma.json</b> reading pack.</p>
      <button class="big" data-act="import">Import a volume</button>
      <ol><li>Tap Import and open the volume's folder in Library.</li><li>Select both the <b>.cbz</b> and the <b>.koma.json</b>.</li><li>It's stored in Koma and reads fully offline from then on.</li></ol></div>${await footer()}`;
    return;
  }
  const cards = await Promise.all(vols.map(async v => {
    const pct = v.pageCount ? Math.round(((v.lastPage || 0) + 1) / v.pageCount * 100) : 0;
    return `<button class="vol" data-vol="${esc(v.id)}">
      <div class="cv">${(await coverUrl(v)) ? `<img src="${await coverUrl(v)}" alt="">` : ""}</div>
      <span class="badge ${v.hasPack ? "" : "none"}">${v.hasPack ? "読 " + v.bubbles : "no readings"}</span>
      <div class="t">${esc(v.title)}</div>
      <div class="m">${v.lastReadAt ? `p. ${(v.lastPage || 0) + 1} / ${v.pageCount}` : `${v.pageCount} pages`}</div>
      <div class="bar"><i style="width:${v.lastReadAt ? pct : 0}%"></i></div></button>`;
  }));
  body.innerHTML = `<div class="grid">${cards.join("")}</div>${await footer()}`;
}
async function footer() {
  let s = "";
  try { const e = await navigator.storage.estimate(); s = `Using ${fmtBytes(e.usage || 0)} on this device`; } catch {}
  return `<div class="foot">${s}${s ? " · " : ""}Koma ${APP_VERSION}</div>`;
}
$("#libBody").addEventListener("click", e => { const v = e.target.closest("[data-vol]"); if (v) openVolume(v.dataset.vol); });

/* ================= import ================= */
async function sha16(blob) {
  const d = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
  return [...new Uint8Array(d)].slice(0, 8).map(x => x.toString(16).padStart(2, "0")).join("");
}
const stemOf = n => n.replace(/\.koma\.json$/i, "").replace(/\.(cbz|zip|json)$/i, "");
fileIn.addEventListener("change", async () => {
  const files = [...fileIn.files]; fileIn.value = "";
  if (!files.length) return;
  const archives = files.filter(f => /\.(cbz|zip)$/i.test(f.name));
  const packs = [];
  for (const f of files.filter(f => /\.json$/i.test(f.name))) {
    try { const j = JSON.parse(await f.text()); if (j.format === "koma-pack") packs.push({ file: f, pack: j }); else toast(`${f.name} isn't a Koma reading pack.`); }
    catch { toast(`Couldn't read ${f.name}.`); }
  }
  try {
    let done = 0;
    for (const a of archives) {
      busy(`Importing ${a.name}…`);
      const id = await sha16(a);
      const match = packs.find(p => p.pack.id === id) || packs.find(p => stemOf(p.file.name) === stemOf(a.name));
      await importArchive(a, id, match && match.pack);
      if (match) packs.splice(packs.indexOf(match), 1);
      done++;
    }
    for (const p of packs) {  // packs for volumes already in the library
      const v = await get("volumes", p.pack.id);
      if (!v) { toast(`No imported volume matches ${p.file.name}. Select its .cbz too.`); continue; }

/* layout + zoom */
function layout() {

  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  const s = Math.min(vw / img.naturalWidth, vh / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  st.base = { L: (vw - w) / 2, T: (vh - h) / 2, w, h };

}

  const W = w * z.z, H = h * z.z;
  z.tx = W > vw ? Math.min(-L, Math.max(vw - W - L, z.tx)) : (vw - W) / 2 - L;

}

/* gestures */
const ptrs = new Map(); let pd = null, pinch = null, lastTap = 0, tapT = null;

    const [a, b] = [...ptrs.values()];

    if (pd) pd.moved = true; return;
  }

viewer.addEventListener("pointermove", e => {

  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    const [a, b] = [...ptrs.values()];
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0); return;
  }
  if (!pd) return;
  const dx = e.clientX - pd.x, dy = e.clientY - pd.y;

    return;

  settings = { ...DEF, ...(await kvGet("settings", {})) };

  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  renderLibrary();
})();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.update().catch(() => {});
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      nw && nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller)
          toast("Update ready. Tap to reload.", () => nw.postMessage("skipWaiting"));
      });
    });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
})();
</script>
